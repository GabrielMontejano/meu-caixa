<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta
      name="description"
      content="Meu Caixa registra entradas e saidas em formato de conversa, com dados salvos somente no aparelho."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Meu Caixa</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button class="back-button hidden" id="backButton" type="button">Voltar</button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">MC</span>
          <div>
            <h1>Meu Caixa</h1>
            <p id="screenSubtitle">Controle simples, privado e direto.</p>
          </div>
        </div>
        <button class="ghost-button" id="backupButton" type="button">Backup</button>
      </header>

      <main>
        <section class="screen active" id="homeScreen">
          <section class="month-card" aria-live="polite">
            <div>
              <span id="monthLabel">Saldo do mes</span>
              <strong id="monthBalance">R$ 0,00</strong>
            </div>
            <p id="monthResume">Sem lancamentos neste mes.</p>
          </section>

          <nav class="home-actions" aria-label="Acoes principais">
            <button class="home-action" data-screen="launch" type="button">
              <strong>Lancar</strong>
              <span>Registrar por conversa</span>
            </button>
            <button class="home-action" data-screen="report" type="button">
              <strong>Relatorio</strong>
              <span>Filtrar e exportar PDF</span>
            </button>
            <button class="home-action" data-screen="edit" type="button">
              <strong>Alterar</strong>
              <span>Editar lancamentos salvos</span>
            </button>
          </nav>
        </section>

        <section class="screen" id="launchScreen">
          <div class="page-title">
            <span>Lancar</span>
            <h2>Novo lancamento</h2>
          </div>
          <div class="chat-panel">
            <div class="messages" id="messages" aria-live="polite"></div>
            <form class="composer" id="entryForm">
              <textarea
                id="entryInput"
                rows="2"
                autocomplete="off"
                placeholder="Ex: gastei 300 reais em gasolina ontem"
              ></textarea>
              <button class="primary-button" type="submit">Enviar</button>
            </form>
          </div>
        </section>

        <section class="screen" id="reportScreen">
          <div class="page-title">
            <span>Relatorio</span>
            <h2>Resumo por periodo</h2>
          </div>
          <div class="report-panel">
            <div class="filters">
              <label>
                Inicio
                <input id="filterStart" type="date" />
              </label>
              <label>
                Fim
                <input id="filterEnd" type="date" />
              </label>
              <label>
                Tipo
                <select id="filterType">
                  <option value="todos">Todos</option>
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saida</option>
                </select>
              </label>
            </div>

            <div class="report-summary">
              <div>
                <span>Entradas</span>
                <strong id="reportIncome">R$ 0,00</strong>
              </div>
              <div>
                <span>Saidas</span>
                <strong id="reportExpense">R$ 0,00</strong>
              </div>
              <div>
                <span>Saldo</span>
                <strong id="reportBalance">R$ 0,00</strong>
              </div>
            </div>

            <button class="primary-button full" id="pdfButton" type="button">Exportar PDF</button>
            <div class="transactions-list" id="transactionsList"></div>
          </div>
        </section>

        <section class="screen" id="editScreen">
          <div class="page-title">
            <span>Alterar</span>
            <h2>Lancamentos salvos</h2>
          </div>
          <div class="edit-panel">
            <div class="edit-list" id="editList"></div>
            <form class="saved-edit-form hidden" id="savedEditForm">
              <input id="editId" type="hidden" />
              <label>
                Tipo
                <select id="editType">
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saida</option>
                </select>
              </label>
              <label>
                Valor
                <input id="editAmount" inputmode="decimal" required />
              </label>
              <label>
                Data da operacao
                <input id="editDate" type="date" required />
              </label>
              <label>
                Nota
                <input id="editNote" required />
              </label>
              <div class="edit-actions">
                <button class="primary-button" type="submit">Salvar alteracao</button>
                <button class="small-button danger" id="cancelSavedEdit" type="button">Cancelar</button>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <dialog class="backup-dialog" id="backupDialog">
      <form method="dialog">
        <div class="dialog-header">
          <h2>Backup</h2>
          <button class="icon-button" value="close" aria-label="Fechar" type="submit">x</button>
        </div>
        <p>Backup restaura os dados no app. PDF e apenas relatorio.</p>
        <div class="dialog-actions">
          <button class="primary-button" id="exportBackupButton" value="close" type="button">
            Baixar backup
          </button>
          <label class="file-button">
            Restaurar backup
            <input id="importBackupInput" type="file" accept="application/json,.json" />
          </label>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=4" defer></script>
  </body>
</html>
